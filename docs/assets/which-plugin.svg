<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1328 424" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Which plugin do I need?</title>
  <desc>Digital Marketing Pro plans the strategy and runs campaigns. ContentForge writes publish-ready long-form content. SocialForge produces a month of social posts. CutForge turns raw photos, clips and voice notes into a finished film. You hand a brief to ContentForge, a content calendar to SocialForge and a film brief to CutForge; each plugin runs on its own.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a4"/>
    </marker>
  </defs>

  <text x="664" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#8a94a4">Which plugin do I need? Pick by the job: use one, or all four on the same brand</text>

  <g text-anchor="middle">
    <g>
      <rect x="20" y="58" width="292" height="230" rx="12" fill="#e3eefb" stroke="#9db8dd"/>
      <text x="166" y="90" font-size="18" font-weight="700" fill="#1f2733">Digital Marketing Pro</text>
      <text x="166" y="114" font-size="13" font-weight="600" fill="#2f4a6e">Plan the strategy, run the campaigns</text>
      <g font-size="12" fill="#5a6577">
        <text x="166" y="148">12-part engagement → Four Core Documents</text>
        <text x="166" y="172">SEO, AEO/GEO, paid media, email, CRM</text>
        <text x="166" y="196">analytics, attribution, agency portfolio</text>
        <text x="166" y="220">16 privacy jurisdictions, EU AI Act Art. 50</text>
        <text x="166" y="244">live writes need your single-use approval</text>
      </g>
      <text x="166" y="274" font-size="11.5" fill="#2f4a6e" font-style="italic">"build the Q3 campaign plan"</text>
    </g>
    <g>
      <rect x="352" y="58" width="292" height="230" rx="12" fill="#e5f1ee" stroke="#9cc5bb"/>
      <text x="498" y="90" font-size="18" font-weight="700" fill="#1f2733">ContentForge</text>
      <text x="498" y="114" font-size="13" font-weight="600" fill="#24564c">Write publish-ready long-form</text>
      <g font-size="12" fill="#5a6577">
        <text x="498" y="148">10-phase pipeline with 10 quality gates</text>
        <text x="498" y="172">fact-checker, humanizer, run auditor</text>
        <text x="498" y="196">real .docx out, C2PA provenance</text>
        <text x="498" y="220">audit, refresh, measure, plan: a loop</text>
        <text x="498" y="244">README in 12 languages</text>
      </g>
      <text x="498" y="274" font-size="11.5" fill="#24564c" font-style="italic">"write a blog post on X"</text>
    </g>
    <g>
      <rect x="684" y="58" width="292" height="230" rx="12" fill="#f9efe2" stroke="#d9b389"/>
      <text x="830" y="90" font-size="18" font-weight="700" fill="#1f2733">SocialForge</text>
      <text x="830" y="114" font-size="13" font-weight="600" fill="#7a4a12">Produce a month of social</text>
      <g font-size="12" fill="#5a6577">
        <text x="830" y="148">calendar in, on-brand creative out</text>
        <text x="830" y="172">brand photos kept pixel-faithful</text>
        <text x="830" y="196">copy for 9 platforms, previews, gallery</text>
        <text x="830" y="220">paid generation quoted before it runs</text>
        <text x="830" y="244">client review, then a delivery audit</text>
      </g>
      <text x="830" y="274" font-size="11.5" fill="#7a4a12" font-style="italic">"produce the whole month"</text>
    </g>
    <g>
      <rect x="1016" y="58" width="292" height="230" rx="12" fill="#efe9f8" stroke="#b6a4d8"/>
      <text x="1162" y="90" font-size="18" font-weight="700" fill="#1f2733">CutForge</text>
      <text x="1162" y="114" font-size="13" font-weight="600" fill="#4e3a7c">Raw footage to a finished film</text>
      <g font-size="12" fill="#5a6577">
        <text x="1162" y="148">photos, clips, voice notes in; final cut out</text>
        <text x="1162" y="172">story, storyboard, narration, sound design</text>
        <text x="1162" y="196">rendered with code: a fix is a re-run</text>
        <text x="1162" y="220">AI only where no camera was, never on faces</text>
        <text x="1162" y="244">paid voice and art capped by your budget</text>
      </g>
      <text x="1162" y="274" font-size="11.5" fill="#4e3a7c" font-style="italic">"make a film from our photos"</text>
    </g>
  </g>

  <line x1="314" y1="173" x2="348" y2="173" stroke="#8a94a4" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="332" y="163" text-anchor="middle" font-size="10.5" fill="#8a94a4">brief</text>

  <path d="M 200 288 C 330 328, 690 328, 824 294" stroke="#8a94a4" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="510" y="334" text-anchor="middle" font-size="10.5" fill="#8a94a4">content calendar</text>

  <path d="M 130 288 C 330 372, 1000 372, 1156 294" stroke="#8a94a4" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="930" y="362" text-anchor="middle" font-size="10.5" fill="#8a94a4">film brief</text>

  <text x="664" y="392" text-anchor="middle" font-size="12" fill="#8a94a4">You carry work from one to the next (a campaign brief, a content calendar, a film brief). Each plugin runs on its own and is useful alone.</text>
  <text x="664" y="412" text-anchor="middle" font-size="12" fill="#8a94a4">Install: /plugin marketplace add indranilbanerjee/neels-plugins, then /plugin install &lt;name&gt;@neels-plugins</text>
</svg>
