# Hermes Agent native plugin manifest for the combined Digital Marketing Pro listing.
# Generated by scripts/build_hermes_bundle.py in the neels-plugins repo; do not edit by hand.
# Only Hermes reads this file. On every other platform the three plugins are separate products
# with their own repos and manifests.

name: digital-marketing-pro
version: 3.57.1
description: >-
  Three open-source marketing toolkits in one Hermes listing, 207 skills in all: Digital Marketing
  Pro v3.36.0 (strategy, SEO/AEO/GEO, paid media, CRM, analytics; 164 skills), ContentForge v4.5.8
  (long-form content, fact-check, humanize, audit; 22 skills) and SocialForge v1.29.8 (social
  creative from a content calendar; 21 skills). Skills only: no tools, hooks or background
  processes. Disclosure: optional scripts call third-party APIs with the user's own keys; packages
  and browsers install only when the user says yes; live writes need a typed yes and, for writes
  the plugin sends itself, a single-use approval record; see README.md and each group's
  PRIVACY.md.
author: Indranil Banerjee
license: MIT
homepage: https://github.com/indranilbanerjee/neels-plugins

provides_tools: []
provides_hooks: []
requires_env: []
# Every credential below is OPTIONAL: nothing is required to install, and a script that needs one
# says so and stops. They are listed (not in requires_env) so the catalog and `hermes plugins` can
# show which environment variables the scripts read. This is the union of ContentForge's and
# SocialForge's lists.
optional_env:
  - name: AIRTABLE_TOKEN
    description: "Airtable personal access token, only if you choose Airtable as the tracking or publish backend"
    secret: true
  - name: ANTHROPIC_API_KEY
    description: "Only for scripts/refresh_models.py (model-registry refresh); a provider without a key is skipped"
    secret: true
  - name: GEMINI_API_KEY
    description: "Gemini API key: image generation and asset indexing in the social group (an alternative to Vertex AI), and the optional model-registry refresh (scripts/refresh_models.py) in every group"
    secret: true
  - name: GOOGLE_APPLICATION_CREDENTIALS
    description: "Path to a Google service-account JSON file (not a secret value)"
    secret: false
  - name: GOOGLE_CLOUD_LOCATION
    description: "Vertex AI region, default us-central1"
    secret: false
  - name: GOOGLE_CLOUD_PROJECT
    description: "Vertex AI project id (an alternative to a stored service-account JSON)"
    secret: false
  - name: HF_API_KEY
    description: "HiggsField API key (optional fallback provider)"
    secret: true
  - name: HF_API_SECRET
    description: "HiggsField API secret (optional fallback provider)"
    secret: true
  - name: OPENAI_API_KEY
    description: "Only for scripts/refresh_models.py (model-registry refresh); a provider without a key is skipped"
    secret: true
  - name: WAVESPEED_API_KEY
    description: "WaveSpeed API key for video generation"
    secret: true
